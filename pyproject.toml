[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfl-hvac"
version = "0.2.0"
description = "Independent reproduction of decision-focused HVAC system identification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "cvxpy>=1.4",
    "ecos>=2.0",
]

[project.optional-dependencies]
research = [
    "torch>=2.2",
    "cvxpylayers>=0.1.9",
]
miqp = ["pyscipopt>=5.2,<7"]
plots = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
