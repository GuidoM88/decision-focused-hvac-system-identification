name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,research,miqp]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python scripts/run_neural_demo.py
      - run: python scripts/run_convex_baseline.py
      - run: python scripts/run_synthetic_dfl.py

  energyplus:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: |
            data/external/energyplus
            data/external/energyplus_case
          key: energyplus-22.1-linux-${{ hashFiles('scripts/setup_energyplus.py') }}
      - run: python scripts/setup_energyplus.py --install-linux
      - run: python -m pytest tests/test_energyplus_runtime.py
        env:
          RUN_ENERGYPLUS_TESTS: "1"
